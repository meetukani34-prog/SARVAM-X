<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SARVAM-X | Authentication</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r149/three.min.js"></script>
  <script src="https://unpkg.com/feather-icons"></script>
</head>

<body class="auth-page">

  <!-- Background Effects -->
  <div class="auth-bg">
    <div class="auth-grid"></div>
  </div>

  <div class="auth-container">
    <a href="index.html" class="back-link">
      <i data-feather="arrow-left"></i> Back to Home
    </a>

    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon" id="auth-3d-model"></div>
        <h1 class="auth-title">Authentication</h1>
        <p class="auth-subtitle">Access your SARVAM-X cognitive twin</p>
      </div>

      <!-- Toggle Switch -->
      <div class="auth-toggle">
        <div class="auth-toggle-slider" id="toggle-slider"></div>
        <div class="auth-toggle-btn active" id="btn-login" onclick="switchForm('login')">Login</div>
        <div class="auth-toggle-btn" id="btn-signup" onclick="switchForm('signup')">Sign Up</div>
      </div>

      <!-- Forms Wrapper -->
      <div class="auth-forms-wrapper">
        <div class="auth-form-slider" id="form-slider">

          <!-- LOGIN FORM -->
          <form class="auth-form" onsubmit="handleAuth(event, 'login')">
            <div class="input-group">
              <label>Email Address</label>
              <div class="input-wrapper">
                <i data-feather="mail"></i>
                <input type="email" class="auth-input" placeholder="user@sarvam.ai" required />
              </div>
            </div>

            <div class="input-group">
              <label>Password</label>
              <div class="input-wrapper">
                <i data-feather="key"></i>
                <input type="password" class="auth-input" placeholder="••••••••" required />
              </div>
            </div>

            <a href="#" class="forgot-pass">Forgot Password?</a>

            <button type="submit" class="btn-submit">
              Sign In <i data-feather="log-in" style="width:18px;height:18px"></i>
            </button>
          </form>

          <!-- SIGNUP FORM -->
          <form class="auth-form" onsubmit="handleAuth(event, 'signup')">
            <div class="input-group">
              <label>Full Name</label>
              <div class="input-wrapper">
                <i data-feather="user"></i>
                <input type="text" class="auth-input" placeholder="Meet Ukani" required />
              </div>
            </div>

            <div class="input-group">
              <label>Email Address</label>
              <div class="input-wrapper">
                <i data-feather="mail"></i>
                <input type="email" class="auth-input" placeholder="user@sarvam.ai" required />
              </div>
            </div>

            <div class="input-group">
              <label>Password</label>
              <div class="input-wrapper">
                <i data-feather="key"></i>
                <input type="password" class="auth-input" placeholder="Create a strong password" required />
              </div>
            </div>

            <button type="submit" class="btn-submit">
              Create Account <i data-feather="user-plus" style="width:18px;height:18px"></i>
            </button>
          </form>

        </div>
      </div>

    </div>
  </div>

  <div id="three-bg-container" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none; opacity:0.3"></div>
  <script src="js/three-core.js"></script>
  
  <script>
    feather.replace();

    function switchForm(type) {
      const slider = document.getElementById('form-slider');
      const toggle = document.getElementById('toggle-slider');
      const btnLogin = document.getElementById('btn-login');
      const btnSignup = document.getElementById('btn-signup');

      if (type === 'signup') {
        slider.style.transform = 'translateX(-50%)';
        toggle.style.transform = 'translateX(100%)';
        btnSignup.classList.add('active');
        btnLogin.classList.remove('active');
      } else {
        slider.style.transform = 'translateX(0)';
        toggle.style.transform = 'translateX(0)';
        btnLogin.classList.add('active');
        btnSignup.classList.remove('active');
      }
    }

    async function handleAuth(event, type) {
      event.preventDefault();
      const form = event.target;
      const btn = form.querySelector('button[type="submit"]');
      const originalText = btn.innerHTML;

      const email = form.querySelector('input[type="email"]').value;
      const password = form.querySelector('input[type="password"]').value;

      let payload = { email, password };
      let endpoint = '/api/auth/login';

      if (type === 'signup') {
        const name = form.querySelector('input[type="text"]').value;
        payload.name = name;
        endpoint = '/api/auth/signup';
      }

      btn.innerHTML = `<svg class="spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg> Authenticating...`;

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();

        if (response.ok && data.success) {
          localStorage.setItem('sarvam_uid', data.user_id);
          localStorage.setItem('sarvam_name', data.name);
          localStorage.setItem('sarvam_email', data.email);
          // Route to correct platform dashboard
          const params = new URLSearchParams(window.location.search);
          const platform = params.get('platform');
          if (platform === 'trinetra') {
            window.location.href = 'trinetra.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        } else {
          alert(data.error || 'Authentication failed');
          btn.innerHTML = originalText;
        }
      } catch (err) {
        alert('Server error. Ensure backend is running.');
        btn.innerHTML = originalText;
      }
    }
    // ─── 3D AUTH MODEL ───
    function initAuth3D() {
      const box = document.getElementById('auth-3d-model');
      if (!box || typeof THREE === 'undefined') return;
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 100);
      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(48, 48);
      box.appendChild(renderer.domElement);
      const geometry = new THREE.TorusGeometry(1, 0.3, 16, 100);
      const material = new THREE.MeshPhongMaterial({ color: 0x00e5ff, wireframe: true, emissive: 0x00e5ff, emissiveIntensity: 0.5 });
      const torus = new THREE.Mesh(geometry, material);
      scene.add(torus);
      scene.add(new THREE.PointLight(0xffffff, 1).clone().set(5,5,5));
      scene.add(new THREE.AmbientLight(0x404040));
      camera.position.z = 3.5;
      function animate() { requestAnimationFrame(animate); torus.rotation.x += 0.01; torus.rotation.y += 0.01; renderer.render(scene, camera); }
      animate();
    }
    if (typeof THREE !== 'undefined') initAuth3D();
    else window.addEventListener('load', initAuth3D);
  </script>

  <style>
    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</body>

</html>
