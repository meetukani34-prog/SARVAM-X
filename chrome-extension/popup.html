<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trinetra AI</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #07090e;
      color: #fff;
      margin: 0;
    }
    h2 {
      margin-top: 0;
      color: #a855f7; /* purple */
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    textarea {
      width: 100%;
      height: 80px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      border-radius: 8px;
      padding: 8px;
      box-sizing: border-box;
      resize: none;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      background: #a855f7;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    button:hover {
      background: #9333ea;
    }
    #result {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.4;
      display: none;
      padding: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 8px;
    }
    .score {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 4px;
      display: block;
    }
    .loader {
      display: none;
      text-align: center;
      margin-top: 10px;
      color: #a855f7;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <h2>Trinetra AI</h2>
  <textarea id="claimInput" placeholder="Paste a claim here, or highlight text and right-click 'Verify with Trinetra AI'"></textarea>
  <button id="verifyBtn">Verify Claim</button>
  
  <div class="loader" id="loader">Analyzing...</div>
  
  <div id="result">
    <span class="score" id="resultScore"></span>
    <div id="resultExplanation"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
